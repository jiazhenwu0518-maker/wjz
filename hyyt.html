<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
    /* ---------- Base Layout ---------- */
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        background:#f5f7fa;color:#333;line-height:1.6;padding:20px;
        /* 新增：讓背景與文字顏色切換時有平滑過渡動畫 */
        transition: background-color 0.4s ease, color 0.4s ease;
    }
    /* 放大整體頁面最大寬度，確保 3 個卡片橫排時有足夠空間 */
    .container{max-width:1000px;margin:0 auto;}

    /* ---------- 切換深淺色按鈕 ---------- */
    .theme-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #ffffff;
        color: #2c3e50;
        border: 2px solid #cbd5e1;
        padding: 10px 18px;
        border-radius: 30px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(0,0,0,.1);
        transition: all 0.3s ease;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .theme-toggle-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0,0,0,.15);
        border-color: #3498db;
    }

    /* ---------- Header ---------- */
    header{
        padding:40px 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 30px;
    }
    
    .headshot-container{
        position:relative;
        width:150px;
        height:auto;
        min-height:120px;
        flex-shrink: 0;
        border-radius:10px;
        background:#ddd;display:flex;
        align-items:center;justify-content:center;overflow:hidden;
        box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:pointer;
        transition: background-color 0.4s ease;
    }
    .headshot-delete-btn{
        position:absolute;
        top:-10px;
        right:-10px;
        width:24px;
        height:24px;
        border-radius:50%;
        background:#e74c3c;
        color:#fff;
        border:none;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        z-index:10;
        box-shadow:0 2px 6px rgba(0,0,0,.3);
        transition:all .3s;
    }
    .headshot-delete-btn:hover{
        transform:scale(1.1);
        box-shadow:0 4px 8px rgba(0,0,0,.4);
    }
    .headshot-placeholder{
        width:100%;height:100%;background:#3498db;
        border-radius:10px;
        display:flex;align-items:center;justify-content:center;
    }
    .headshot-placeholder-text{
        font-size:1.2rem;
        font-weight:bold;
        color:#fff;
        text-shadow:1px 1px 2px rgba(0,0,0,.3);
        text-align: center;
        padding: 10px;
    }
    #headshotImg{
        width:100%;height:100%;object-fit:cover;display:none;
    }

    /* 自我介紹輸入框樣式 */
    .intro-input {
        flex: 1;
        font-size: 1.2rem;
        color: #34495e;
        text-align: left;
        border: 2px dashed #cbd5e1;
        background: #ffffff;
        padding: 15px;
        min-height: 120px;
        resize: vertical;
        transition: all 0.4s ease;
    }
    .intro-input:focus {
        border-style: solid;
        border-color: #3498db;
    }

    @media(max-width:768px){
        header {
            flex-direction: column;
            text-align: center;
        }
        .headshot-container {
            width: 100%;
            height: 150px;
        }
        .intro-input {
            width: 100%;
            text-align: center;
        }
        /* 手機版微調按鈕位置 */
        .theme-toggle-btn {
            top: 10px;
            right: 10px;
            padding: 6px 12px;
            font-size: 0.85rem;
        }
    }

    /* ---------- Projects ---------- */
    .projects-container{
        max-width:1000px;margin:60px auto;padding:0;
    }
    /* 已修改：標題字體大小統一為 2.2rem */
    .section-title{
        text-align:center;font-size:2.2rem;margin-bottom:40px;color:#2c3e50;
        transition: color 0.4s ease;
    }
    .projects-grid{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap:20px;
        width:100%;
        margin:0 auto;
    }
    .project-card{
        background:#fff;padding:25px;border-radius:10px;
        box-shadow:0 4px 15px rgba(0,0,0,.1);
        transition:transform .3s, box-shadow .3s, background-color 0.4s ease;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .project-card:hover{
        transform:translateY(-5px);
        box-shadow:0 8px 25px rgba(0,0,0,.15);
    }
    
    /* 專案卡片內的填空框樣式 */
    .project-title-input {
        font-size: 1.25rem !important;
        font-weight: bold;
        color: #3498db !important;
    }
    .project-desc-input {
        resize: vertical;
        min-height: 100px;
        color: #555;
    }
    .project-link-input {
        font-size: 0.9rem !important;
        color: #7f8c8d;
    }

    /* ---------- Contact ---------- */
    .contact-section{
        max-width:1000px;
        margin:60px auto 0 auto;
        padding:0;
    }
    /* 已修改：標題字體大小統一為 2.2rem */
    .contact-title{
        text-align:center;font-size:2.2rem;margin-bottom:30px;color:#2c3e50;
        transition: color 0.4s ease;
    }
    .contact-grid{
        display:grid;grid-template-columns:repeat(4,1fr);gap:15px;
        padding:30px;background:#fff;border-radius:10px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        transition: background-color 0.4s ease;
    }

    /* 手機等窄螢幕時自動調整尺寸 */
    @media(max-width:768px){
        .projects-grid{grid-template-columns:1fr;}
        .contact-grid{grid-template-columns:1fr;}
        .section-title, .contact-title{font-size:1.8rem;}
    }

    input,textarea{
        width:100%;padding:12px 15px;border:2px solid #ddd;border-radius:10px;
        font-family:inherit;font-size:1rem;transition:all .3s;
    }
    input:focus,textarea:focus{border-color:#3498db;outline:none;}

    .submit-btn{
        background:#3498db;color:#fff;
        padding:14px 32px;border:none;border-radius:30px;
        font-size:1.1rem;font-weight:600;cursor:pointer;
        box-shadow:0 5px 15px rgba(52,152,219,.3);
        transition:all .3s;
    }
    .submit-btn:hover{
        background:#2980b9;transform:translateY(-2px);
    }

    /* ==========================================
       ---------- 深色模式 (Dark Mode) 樣式 ----------
       ========================================== */
    body.dark-mode {
        background: #1a1b26;
        color: #e0e0e0;
    }
    body.dark-mode .theme-toggle-btn {
        background: #24283b;
        color: #c0caf5;
        border-color: #414868;
    }
    body.dark-mode .section-title,
    body.dark-mode .contact-title {
        color: #c0caf5;
    }
    body.dark-mode .project-card,
    body.dark-mode .contact-grid {
        background: #24283b;
        box-shadow: 0 4px 15px rgba(0,0,0,.3);
    }
    body.dark-mode .intro-input {
        background: #24283b;
        color: #e0e0e0;
        border-color: #414868;
    }
    body.dark-mode input,
    body.dark-mode textarea {
        background: #1a1b26;
        color: #e0e0e0;
        border-color: #414868;
    }
    body.dark-mode input::placeholder,
    body.dark-mode textarea::placeholder,
    body.dark-mode .intro-input::placeholder {
        color: #7982a9;
    }
    body.dark-mode .project-title-input {
        color: #7aa2f7 !important;
    }
    body.dark-mode .project-desc-input {
        color: #a9b1d6;
    }
</style>
</head>
<body>

<!-- 新增：深淺色切換按鈕 -->
<button class="theme-toggle-btn" id="themeToggleBtn">
    <span>🌙</span> 深色模式
</button>

<div class="container">
    <header>
        <div class="headshot-container">
            <input type="file" id="headshotInput" accept="image/*" style="display:none;">
            <div class="headshot-placeholder">
                <img id="headshotImg" src="" alt="Headshot">
                <div id="placeholderText" class="headshot-placeholder-text">Upload Your Photo</div>
            </div>
            <button class="headshot-delete-btn" id="headshotDeleteBtn" style="display:none;">×</button>
        </div>

        <textarea class="intro-input" placeholder="請輸入自我介紹"></textarea>
    </header>

    <section class="projects-container">
        <h2 class="section-title">作品集</h2>
        <div class="projects-grid">
            
            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

        </div>
    </section>

    <section class="contact-section">
        <h2 class="contact-title">聯絡我</h2>
        <form id="contactForm">
            <div class="contact-grid">
                <input type="text" id="name" placeholder="姓名" required>
                <input type="email" id="email" placeholder="Email" required>
                <textarea id="message" rows="4" placeholder="留言" required></textarea>
                <button type="submit" class="submit-btn">送出</button>
            </div>
        </form>
    </section>
</div>

<script>
    // 新增：深淺色模式切換邏輯
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    
    themeToggleBtn.addEventListener('click', () => {
        // 切換 body 的 dark-mode class
        document.body.classList.toggle('dark-mode');
        
        // 根據目前的模式切換按鈕內的文字與圖示
        if (document.body.classList.contains('dark-mode')) {
            themeToggleBtn.innerHTML = '<span>☀️</span> 淺色模式';
        } else {
            themeToggleBtn.innerHTML = '<span>🌙</span> 深色模式';
        }
    });

    // Headshot upload preview
    const headshotInput = document.getElementById('headshotInput');
    const headshotImg = document.getElementById('headshotImg');
    const placeholderText = document.getElementById('placeholderText');
    const headshotContainer = document.querySelector('.headshot-container');

    // Click container to trigger file input
    headshotContainer.addEventListener('click', () => {
        headshotInput.click();
    });

    // When file selected, preview
    headshotInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                headshotImg.src = event.target.result;
                headshotImg.style.display = 'block';
                placeholderText.style.display = 'none';
                headshotDeleteBtn.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }
    });

    // Delete headshot
    headshotDeleteBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent triggering the file input
        headshotImg.src = '';
        headshotImg.style.display = 'none';
        placeholderText.style.display = 'block';
        headshotDeleteBtn.style.display = 'none';
        headshotInput.value = ''; // Clear the file input
    });

    // 表單提交處理
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 防止表單重整

        // 顯示成功提示
        alert('留言已成功送出！');

        // 清空表單欄位
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('message').value = '';

        // 聚焦到姓名欄位（視覺上清空後的回饋）
        document.getElementById('name').focus();
    });
</script>
</body>
</html>
