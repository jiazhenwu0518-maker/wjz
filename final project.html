<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            light: {
              bg: '#f5f7fa',
              text: '#333333',
              card: '#ffffff',
              border: '#cbd5e1',
              primary: '#3498db',
              primaryHover: '#2980b9'
            },
            dark: {
              bg: '#1a1b26',
              text: '#e0e0e0',
              card: '#24283b',
              border: '#414868',
              primary: '#7aa2f7',
              inputBg: '#1a1b26',
              placeholder: '#7982a9'
            }
          },
          transitionDuration: {
            '400': '400ms',
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel" data-presets="react">
    const { useState, useRef } = React;

    // ==========================================
    // Services: ECPay Integration
    // ==========================================
    const MERCHANT_ID = "2000132";
    const HASH_KEY = "5294y06JbISpM5x9";
    const HASH_IV = "v77hoKGq4kWxNNIS";
    const ECPAY_URL = "https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5";

    function urlEncodeDotNet(str) {
      return encodeURIComponent(str)
        .replace(/%20/g, "+")
        .replace(/'/g, "%27")
        .replace(/~/g, "%7e");
    }

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex.toUpperCase();
    }

    async function generateCheckMacValue(params) {
      const sorted = Object.keys(params).sort();
      const query = sorted.map((k) => `${k}=${params[k]}`).join("&");
      const raw = `HashKey=${HASH_KEY}&${query}&HashIV=${HASH_IV}`;
      const encoded = urlEncodeDotNet(raw).toLowerCase();
      return await sha256(encoded);
    }

    function getTradeDate() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    // ==========================================
    // Components
    // ==========================================

    const ThemeToggle = ({ isDarkMode, toggleTheme }) => {
      return (
        <button
          onClick={toggleTheme}
          className="fixed top-5 right-5 md:top-5 md:right-5 bg-white dark:bg-dark-card text-slate-800 dark:text-[#c0caf5] border-2 border-light-border dark:border-dark-border px-4 py-2 md:px-5 md:py-2.5 rounded-full text-sm md:text-base font-semibold cursor-pointer shadow-[0_4px_12px_rgba(0,0,0,0.1)] hover:-translate-y-0.5 hover:shadow-[0_6px_16px_rgba(0,0,0,0.15)] hover:border-light-primary transition-all duration-300 z-50 flex items-center gap-2"
        >
          {isDarkMode ? (
            <><span>☀️</span> 淺色模式</>
          ) : (
            <><span>🌙</span> 深色模式</>
          )}
        </button>
      );
    };

    const Header = () => {
      const fileInputRef = useRef(null);
      const [headshotUrl, setHeadshotUrl] = useState(null);
      const [introText, setIntroText] = useState('');

      const handleContainerClick = () => {
        if (!headshotUrl) {
          fileInputRef.current?.click();
        }
      };

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            if (event.target?.result) {
              setHeadshotUrl(event.target.result);
            }
          };
          reader.readAsDataURL(file);
        }
      };

      const handleDelete = (e) => {
        e.stopPropagation();
        setHeadshotUrl(null);
        if (fileInputRef.current) {
          fileInputRef.current.value = '';
        }
      };

      return (
        <header className="py-10 flex flex-col md:flex-row items-center md:items-stretch justify-center gap-8">
          <div 
            className="relative w-full max-w-[200px] md:w-[150px] h-[200px] md:h-auto min-h-[150px] md:min-h-[120px] shrink-0 rounded-xl bg-gray-200 dark:bg-slate-700 flex items-center justify-center overflow-hidden shadow-[0_4px_12px_rgba(0,0,0,0.1)] cursor-pointer transition-colors duration-400 group"
            onClick={handleContainerClick}
          >
            <input
              type="file"
              ref={fileInputRef}
              accept="image/*"
              className="hidden"
              onChange={handleFileChange}
            />
            
            {headshotUrl ? (
              <>
                <img src={headshotUrl} alt="Headshot" className="w-full h-full object-cover" />
                <button
                  onClick={handleDelete}
                  className="absolute top-2 right-2 w-8 h-8 md:w-6 md:h-6 md:-top-2 md:-right-2 rounded-full bg-red-500 text-white border-none flex items-center justify-center cursor-pointer z-10 shadow-[0_2px_6px_rgba(0,0,0,0.3)] transition-all duration-300 hover:scale-110 hover:shadow-[0_4px_8px_rgba(0,0,0,0.4)] opacity-100 md:opacity-0 md:group-hover:opacity-100"
                  aria-label="Delete photo"
                >
                  ×
                </button>
              </>
            ) : (
              <div className="w-full h-full bg-light-primary rounded-xl flex items-center justify-center p-4">
                <div className="text-lg font-bold text-white drop-shadow-md text-center">
                  Upload Your Photo
                </div>
              </div>
            )}
          </div>

          <textarea
            className="flex-1 w-full text-lg text-slate-700 dark:text-dark-text text-center md:text-left border-2 border-dashed border-light-border dark:border-dark-border bg-white dark:bg-dark-card p-4 min-h-[150px] md:min-h-[120px] resize-y transition-all duration-400 focus:border-solid focus:border-light-primary outline-none rounded-xl placeholder-gray-400 dark:placeholder-dark-placeholder"
            placeholder="請輸入自我介紹"
            value={introText}
            onChange={(e) => setIntroText(e.target.value)}
          />
        </header>
      );
    };

    const ProjectCard = () => {
      const [title, setTitle] = useState('');
      const [desc, setDesc] = useState('');
      const [link, setLink] = useState('');

      const inputBaseClass = "w-full p-3 border-2 border-gray-200 dark:border-dark-border rounded-lg font-sans text-base transition-all duration-300 focus:border-light-primary outline-none bg-transparent dark:bg-dark-inputBg dark:text-dark-text placeholder-gray-400 dark:placeholder-dark-placeholder";

      return (
        <div className="bg-white dark:bg-dark-card p-6 rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.1)] dark:shadow-[0_4px_15px_rgba(0,0,0,0.3)] transition-all duration-400 flex flex-col gap-3 hover:-translate-y-1 hover:shadow-[0_8px_25px_rgba(0,0,0,0.15)]">
          <input
            type="text"
            className={`${inputBaseClass} text-xl font-bold text-light-primary dark:text-dark-primary`}
            placeholder="請輸入專案名稱"
            value={title}
            onChange={(e) => setTitle(e.target.value)}
          />
          <textarea
            className={`${inputBaseClass} resize-y min-h-[100px] text-gray-600 dark:text-[#a9b1d6]`}
            placeholder="請輸入專案描述"
            value={desc}
            onChange={(e) => setDesc(e.target.value)}
          />
          <input
            type="url"
            className={`${inputBaseClass} text-sm text-gray-500`}
            placeholder="請輸入專案連結 (例：https://...)"
            value={link}
            onChange={(e) => setLink(e.target.value)}
          />
        </div>
      );
    };

    const Projects = () => {
      const projectCards = [1, 2, 3];

      return (
        <section className="max-w-[1000px] mx-auto my-16 px-0">
          <h2 className="text-center text-3xl md:text-[2.2rem] mb-10 text-slate-800 dark:text-[#c0caf5] transition-colors duration-400 font-bold">
            作品集
          </h2>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-5 w-full mx-auto">
            {projectCards.map((id) => (
              <ProjectCard key={id} />
            ))}
          </div>
        </section>
      );
    };

    const Sponsor = () => {
      const [isProcessing, setIsProcessing] = useState(false);

      const handlePayment = async () => {
        setIsProcessing(true);
        try {
          const params = {
            MerchantID: MERCHANT_ID,
            MerchantTradeNo: "CAMP" + Date.now(),
            MerchantTradeDate: getTradeDate(),
            PaymentType: "aio",
            TotalAmount: "100",
            TradeDesc: "vibe coding camp test",
            ItemName: "Vibe Coding 專案 x 1",
            ReturnURL: "https://example.com/payment-result",
            ChoosePayment: "Credit",
            EncryptType: "1",
          };

          params.CheckMacValue = await generateCheckMacValue(params);

          const form = document.createElement('form');
          form.method = 'POST';
          form.action = ECPAY_URL;
          form.target = '_blank'; // 避免 iframe 拒絕連線
          form.style.display = 'none';

          Object.entries(params).forEach(([key, value]) => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = value;
            form.appendChild(input);
          });

          document.body.appendChild(form);
          form.submit();

          setTimeout(() => {
            if (document.body.contains(form)) {
              document.body.removeChild(form);
            }
            setIsProcessing(false);
          }, 1000);

        } catch (error) {
          console.error("Payment error:", error);
          alert("付款發生錯誤，請稍後再試。");
          setIsProcessing(false);
        }
      };

      return (
        <section className="max-w-[1000px] mx-auto mt-16 mb-10 px-0">
          <h2 className="text-center text-3xl md:text-[2.2rem] mb-8 text-slate-800 dark:text-[#c0caf5] transition-colors duration-400 font-bold">
            贊助專案
          </h2>
          <div className="flex justify-center">
            <div className="bg-white dark:bg-dark-card p-8 rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.1)] dark:shadow-[0_4px_15px_rgba(0,0,0,0.3)] transition-all duration-400 flex flex-col items-center gap-4 hover:-translate-y-1 hover:shadow-[0_8px_25px_rgba(0,0,0,0.15)] max-w-sm w-full text-center border-t-4 border-light-primary dark:border-dark-primary">
              <div className="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center mb-2">
                <span className="text-3xl">🚀</span>
              </div>
              <h3 className="text-2xl font-bold text-slate-800 dark:text-[#c0caf5]">Vibe Coding 專案</h3>
              <div className="text-4xl font-extrabold text-light-primary dark:text-dark-primary my-2">NT$ 100</div>
              <p className="text-gray-500 dark:text-[#a9b1d6] mb-6 text-sm">
                支持我的創作與專案開發 (綠界測試環境)
              </p>
              <button
                onClick={handlePayment}
                disabled={isProcessing}
                className="w-full bg-light-primary text-white py-3.5 px-8 border-none rounded-full text-lg font-semibold cursor-pointer shadow-[0_5px_15px_rgba(52,152,219,0.3)] transition-all duration-300 hover:bg-light-primaryHover hover:-translate-y-0.5 disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:translate-y-0 flex justify-center items-center gap-2"
              >
                {isProcessing ? (
                  <>
                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    處理中...
                  </>
                ) : (
                  '前往付款'
                )}
              </button>
            </div>
          </div>
        </section>
      );
    };

    const Contact = () => {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [message, setMessage] = useState('');
      const nameInputRef = useRef(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        alert('留言已成功送出！');
        setName('');
        setEmail('');
        setMessage('');
        nameInputRef.current?.focus();
      };

      const inputBaseClass = "w-full p-3 border-2 border-gray-200 dark:border-dark-border rounded-lg font-sans text-base transition-all duration-300 focus:border-light-primary outline-none bg-transparent dark:bg-dark-inputBg dark:text-dark-text placeholder-gray-400 dark:placeholder-dark-placeholder";

      return (
        <section className="max-w-[1000px] mx-auto mt-16 mb-10 px-0">
          <h2 className="text-center text-3xl md:text-[2.2rem] mb-8 text-slate-800 dark:text-[#c0caf5] transition-colors duration-400 font-bold">
            聯絡我
          </h2>
          <form onSubmit={handleSubmit}>
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 p-6 md:p-8 bg-white dark:bg-dark-card rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.08)] dark:shadow-[0_4px_15px_rgba(0,0,0,0.3)] transition-colors duration-400 items-start">
              <div className="md:col-span-1">
                <input
                  type="text"
                  ref={nameInputRef}
                  placeholder="姓名"
                  required
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className={inputBaseClass}
                />
              </div>
              <div className="md:col-span-1">
                <input
                  type="email"
                  placeholder="Email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className={inputBaseClass}
                />
              </div>
              <div className="md:col-span-1">
                <textarea
                  rows={4}
                  placeholder="留言"
                  required
                  value={message}
                  onChange={(e) => setMessage(e.target.value)}
                  className={`${inputBaseClass} resize-y md:h-[52px] md:min-h-[52px]`}
                />
              </div>
              <div className="md:col-span-1">
                <button
                  type="submit"
                  className="w-full bg-light-primary text-white py-3.5 px-8 border-none rounded-full text-lg font-semibold cursor-pointer shadow-[0_5px_15px_rgba(52,152,219,0.3)] transition-all duration-300 hover:bg-light-primaryHover hover:-translate-y-0.5"
                >
                  送出
                </button>
              </div>
            </div>
          </form>
        </section>
      );
    };

    // ==========================================
    // Main Application
    // ==========================================
    function App() {
      const [isDarkMode, setIsDarkMode] = useState(false);

      return (
        <div className={`${isDarkMode ? 'dark' : ''}`}>
          <div className="min-h-screen bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text transition-colors duration-400 font-sans p-5">
            <ThemeToggle isDarkMode={isDarkMode} toggleTheme={() => setIsDarkMode(!isDarkMode)} />
            
            <div className="max-w-[1000px] mx-auto">
              <Header />
              <Projects />
              <Sponsor />
              <Contact />
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // Mount React App
    // ==========================================
    const rootElement = document.getElementById('root');
    if (!rootElement) {
      throw new Error("Could not find root element to mount to");
    }

    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
  </script>
</body>
</html>
